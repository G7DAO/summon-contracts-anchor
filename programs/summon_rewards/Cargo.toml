[package]
name = "summon_rewards"
version = "0.1.0"
description = "Summon Rewards - Solana port of the Summon Rewards system"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "summon_rewards"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "token_2022", "associated_token"] }
spl-token-2022 = { version = "3.0", features = ["no-entrypoint"] }

[dev-dependencies]
litesvm = "0.3.0"
solana-sdk = "2.0"
