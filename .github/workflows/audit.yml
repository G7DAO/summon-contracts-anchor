name: AI Security Audit

on:
    push:
        branches: [main]

jobs:
    audit:
        name: "Audit: ${{ matrix.model }}"
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - model: opus
                      secret_name: ANTHROPIC_API_KEY
                      display: "Claude Opus 4.6"
                    - model: codex
                      secret_name: OPENAI_API_KEY
                      display: "GPT-Codex-5.3"
                    - model: gemini
                      secret_name: GOOGLE_API_KEY
                      display: "Gemini 3 Pro"

        steps:
            - uses: actions/checkout@v4

            - name: Install jq
              run: sudo apt-get install -y jq

            - name: Run ${{ matrix.display }} Audit
              env:
                  API_KEY: ${{ secrets[matrix.secret_name] }}
              run: |
                  if [[ -z "$API_KEY" ]]; then
                    echo "⚠️  Secret ${{ matrix.secret_name }} not set — skipping ${{ matrix.display }}"
                    mkdir -p audit-reports
                    echo "# ${{ matrix.display }} — Skipped" > audit-reports/${{ matrix.model }}-$(date -u +%Y-%m-%d).md
                    echo "Secret \`${{ matrix.secret_name }}\` not configured." >> audit-reports/${{ matrix.model }}-$(date -u +%Y-%m-%d).md
                    exit 0
                  fi
                  bash .github/scripts/audit.sh \
                    --model ${{ matrix.model }} \
                    --api-key "$API_KEY"

            - name: Upload audit report
              uses: actions/upload-artifact@v4
              with:
                  name: audit-report-${{ matrix.model }}
                  path: audit-reports/
                  retention-days: 90

    summary:
        name: Post Audit Summary
        runs-on: ubuntu-latest
        needs: audit
        if: always()
        steps:
            - uses: actions/checkout@v4

            - name: Download all reports
              uses: actions/download-artifact@v4
              with:
                  path: audit-reports
                  pattern: audit-report-*
                  merge-multiple: true

            - name: Generate summary
              run: |
                  echo "## 🔍 AI Security Audit Results" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Model | Status | Report |" >> $GITHUB_STEP_SUMMARY
                  echo "|-------|--------|--------|" >> $GITHUB_STEP_SUMMARY

                  for report in audit-reports/*.md; do
                    if [[ -f "$report" ]]; then
                      filename=$(basename "$report")
                      model=$(echo "$filename" | cut -d'-' -f1)

                      if grep -q "Skipped" "$report"; then
                        echo "| $model | ⚠️ Skipped (no API key) | — |" >> $GITHUB_STEP_SUMMARY
                      else
                        lines=$(wc -l < "$report")
                        echo "| $model | ✅ Complete ($lines lines) | See artifacts |" >> $GITHUB_STEP_SUMMARY
                      fi
                    fi
                  done

                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "📦 Download full reports from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
