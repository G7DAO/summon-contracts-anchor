name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SOLANA_VERSION: "1.18.26"
  ANCHOR_VERSION: "0.30.1"
  ANCHOR_INSTALL_TOOLCHAIN: "1.79.0"
  RUST_TOOLCHAIN: "1.85.0"
  NODE_VERSION: "20"

jobs:
  # ─── Clippy Lint ───────────────────────────────────────────────
  lint:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-clippy-${{ runner.os }}-

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ─── Anchor Build ──────────────────────────────────────────────
  build:
    name: Anchor Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-build-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-build-${{ runner.os }}-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          rustup toolchain install ${{ env.ANCHOR_INSTALL_TOOLCHAIN }} --profile minimal
          cargo +${{ env.ANCHOR_INSTALL_TOOLCHAIN }} install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} anchor-cli --locked

      - name: Generate keypair
        run: solana-keygen new --no-bip39-passphrase --silent

      - name: Build
        run: RUSTUP_TOOLCHAIN=${{ env.RUST_TOOLCHAIN }} anchor build --no-idl

  # ─── Anchor Test ───────────────────────────────────────────────
  test:
    name: Anchor Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${{ env.SOLANA_VERSION }}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          rustup toolchain install ${{ env.ANCHOR_INSTALL_TOOLCHAIN }} --profile minimal
          cargo +${{ env.ANCHOR_INSTALL_TOOLCHAIN }} install --git https://github.com/coral-xyz/anchor --tag v${{ env.ANCHOR_VERSION }} anchor-cli --locked

      - name: Generate keypair
        run: solana-keygen new --no-bip39-passphrase --silent

      - name: Build
        run: RUSTUP_TOOLCHAIN=${{ env.RUST_TOOLCHAIN }} anchor build --no-idl

      - name: Run Rust tests
        run: cargo +${{ env.RUST_TOOLCHAIN }} test --workspace --all-targets --no-fail-fast
