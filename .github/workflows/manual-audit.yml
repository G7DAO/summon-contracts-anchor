name: Manual AI Audit

on:
    workflow_dispatch:
        inputs:
            run_opus:
                description: "🟠 Claude Opus 4.6"
                type: boolean
                default: true
            run_codex:
                description: "🟢 GPT-Codex-5.3"
                type: boolean
                default: true
            run_gemini:
                description: "🔵 Gemini 3 Pro"
                type: boolean
                default: true

jobs:
    # ─── Model Selection Matrix ───────────────────────────────────
    #
    #  ┌─────────────────┬──────────┬─────────────┐
    #  │ Model           │ Default  │ Input       │
    #  ├─────────────────┼──────────┼─────────────┤
    #  │ Claude Opus 4.6 │ ✅ On    │ run_opus    │
    #  │ GPT-Codex-5.3   │ ✅ On    │ run_codex   │
    #  │ Gemini 3 Pro    │ ✅ On    │ run_gemini  │
    #  └─────────────────┴──────────┴─────────────┘
    #

    audit-opus:
        name: "🟣 Claude Opus 4.6"
        runs-on: ubuntu-latest
        if: ${{ inputs.run_opus }}
        steps:
            - uses: actions/checkout@v4

            - name: Install jq
              run: sudo apt-get install -y jq

            - name: Run Opus Audit
              env:
                  API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
              run: |
                  if [[ -z "$API_KEY" ]]; then
                    echo "::error::ANTHROPIC_API_KEY secret is not set"
                    exit 1
                  fi
                  bash .github/scripts/audit.sh --model opus --api-key "$API_KEY"

            - name: Upload report
              uses: actions/upload-artifact@v4
              with:
                  name: audit-report-opus
                  path: audit-reports/
                  retention-days: 90

    audit-codex:
        name: "🟢 GPT-Codex-5.3"
        runs-on: ubuntu-latest
        if: ${{ inputs.run_codex }}
        steps:
            - uses: actions/checkout@v4

            - name: Install jq
              run: sudo apt-get install -y jq

            - name: Run Codex Audit
              env:
                  API_KEY: ${{ secrets.OPENAI_API_KEY }}
              run: |
                  if [[ -z "$API_KEY" ]]; then
                    echo "::error::OPENAI_API_KEY secret is not set"
                    exit 1
                  fi
                  bash .github/scripts/audit.sh --model codex --api-key "$API_KEY"

            - name: Upload report
              uses: actions/upload-artifact@v4
              with:
                  name: audit-report-codex
                  path: audit-reports/
                  retention-days: 90

    audit-gemini:
        name: "🔵 Gemini 3 Pro"
        runs-on: ubuntu-latest
        if: ${{ inputs.run_gemini }}
        steps:
            - uses: actions/checkout@v4

            - name: Install jq
              run: sudo apt-get install -y jq

            - name: Run Gemini Audit
              env:
                  API_KEY: ${{ secrets.GOOGLE_API_KEY }}
              run: |
                  if [[ -z "$API_KEY" ]]; then
                    echo "::error::GOOGLE_API_KEY secret is not set"
                    exit 1
                  fi
                  bash .github/scripts/audit.sh --model gemini --api-key "$API_KEY"

            - name: Upload report
              uses: actions/upload-artifact@v4
              with:
                  name: audit-report-gemini
                  path: audit-reports/
                  retention-days: 90

    summary:
        name: 📊 Audit Summary
        runs-on: ubuntu-latest
        needs: [audit-opus, audit-codex, audit-gemini]
        if: always()
        steps:
            - name: Download all reports
              uses: actions/download-artifact@v4
              with:
                  path: audit-reports
                  pattern: audit-report-*
                  merge-multiple: true

            - name: Generate summary
              run: |
                  echo "## 🔍 Manual AI Security Audit Results" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Model | Status | Lines |" >> $GITHUB_STEP_SUMMARY
                  echo "|-------|--------|-------|" >> $GITHUB_STEP_SUMMARY

                  for model in opus codex gemini; do
                    report=$(find audit-reports -name "${model}-*.md" 2>/dev/null | head -1)
                    if [[ -n "$report" && -f "$report" ]]; then
                      lines=$(wc -l < "$report")
                      echo "| $model | ✅ Complete | $lines |" >> $GITHUB_STEP_SUMMARY
                    else
                      echo "| $model | ⏭️ Skipped | — |" >> $GITHUB_STEP_SUMMARY
                    fi
                  done

                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "📦 Download full reports from the **Artifacts** section." >> $GITHUB_STEP_SUMMARY
